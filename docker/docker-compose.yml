version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: timecapsule
      POSTGRES_PASSWORD: timecapsule
      POSTGRES_DB: timecapsule
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timecapsule"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
